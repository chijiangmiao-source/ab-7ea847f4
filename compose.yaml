services:
  lock-coordinator:
    build: .
    image: lock-coordinator:latest
    container_name: lock-coordinator
    ports:
      # 宿主机端口可通过环境变量 HOST_PORT 配置（默认 8080）
      - "${HOST_PORT:-8080}:8080"
    environment:
      LOCK_HOST: "0.0.0.0"
      LOCK_PORT: "8080"
      LOCK_DATA_DIR: "/data"
    volumes:
      - lock-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 3s

  verify:
    # 验收容器：单元测试 + 构建检查 + API/HTTP 冒烟（含死锁撤销与重启恢复），
    # 退出码即验收结果（0 通过 / 非 0 失败）。
    build: .
    image: lock-coordinator:latest
    container_name: lock-coordinator-verify
    depends_on:
      lock-coordinator:
        condition: service_healthy
    environment:
      BASE_URL: "http://lock-coordinator:8080"
    command: ["sh", "tests/verify.sh"]
    restart: "no"

volumes:
  lock-data:
